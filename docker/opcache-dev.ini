; Serveur de développement (artisan serve) : sans opcache en CLI, chaque requête
; recompile tout le framework à travers le montage Windows (6 à 7 s par page).
opcache.enable_cli=1
opcache.jit=off
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=120
; Les modifications de fichiers PHP sont prises en compte au plus tard après 120 s.
